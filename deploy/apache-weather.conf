# Reverse-proxy the weather-compare service (systemd: weather-compare, on
# 127.0.0.1:3020) at /weather/. Paste this block inside the HTTPS
# <VirtualHost *:443> for your site, then reload Apache.
#
# Requires:  a2enmod proxy proxy_http
#
# The service serves all front-end URLs relative to "/", so the trailing-slash
# ProxyPass maps /weather/* -> /* transparently. The RedirectMatch makes the
# bare /weather work too.

RedirectMatch ^/weather$ /weather/
ProxyPreserveHost On
ProxyPass /weather/ http://127.0.0.1:3020/
ProxyPassReverse /weather/ http://127.0.0.1:3020/
